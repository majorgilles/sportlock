[project]
name = "sportlock"
version = "0.1.0"
description = "Scheduled training locks for Omarchy"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.11"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "I"]
